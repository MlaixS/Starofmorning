name: Gerar APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Testes do disco virtual
        run: node tests/test_vfs.js
      - run: npm install
      - run: npx cap add android
      - run: python3 tools/android_customize.py
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Morningstar-APK, path: android/app/build/outputs/apk/debug/app-debug.apk }
